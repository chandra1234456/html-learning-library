<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viewer – HTML Learning Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
    <div id="auth-gate" class="auth-gate" hidden></div>

    <div id="app-root" hidden>
        <header class="site-header">
            <a class="brand" href="index.html"><span class="brand-icon"><i data-icon="book" data-size="20"></i></span><span class="brand-name">HTML Learning Library</span></a>
            <nav class="nav" aria-label="Main">
                <a class="nav-link" href="index.html" aria-current="page"><i data-icon="grid"></i><span>Library</span></a>
                <a class="nav-link" href="reader.html"><i data-icon="reader"></i><span>Reader</span></a>
                <a class="nav-link" href="articles.html"><i data-icon="bookmark"></i><span>Saved</span></a>
            </nav>
            <span class="header-spacer"></span>
            <button id="theme-toggle" class="btn btn-icon btn-ghost" type="button" aria-label="Toggle dark mode"></button>
            <a class="btn btn-primary btn-new" href="editor.html"><i data-icon="plus"></i><span>New page</span></a>
        </header>

        <main>
            <div class="state-box" id="viewer-loading"><p>Loading page...</p></div>
            <div class="state-box" id="viewer-error" hidden>
                <h2>⚠ Unable to open page</h2>
                <p id="viewer-error-text"></p>
                <div class="error-actions">
                    <a class="btn" href="index.html"><i data-icon="back"></i><span>Back to library</span></a>
                </div>
            </div>

            <article id="viewer-content" hidden>
                <div class="viewer-actions">
                    <a class="btn" href="index.html"><i data-icon="back"></i><span>Back</span></a>
                    <a class="btn" id="edit-link" href="editor.html"><i data-icon="edit"></i><span>Edit</span></a>
                    <button class="btn btn-danger" id="delete-btn" type="button"><i data-icon="trash"></i><span>Delete</span></button>
                </div>

                <header class="page-info" id="page-info">
                    <h1 id="page-title"></h1>
                    <p id="page-description" class="page-description"></p>
                    <span class="category-badge" id="page-category"></span>
                    <div class="tags" id="page-tags"></div>
                    <p class="card-meta" id="page-dates"></p>
                </header>

                <div class="tab-bar">
                    <div role="tablist" aria-label="View mode" class="tabs">
                        <button role="tab" id="tab-preview" aria-controls="panel-preview" aria-selected="true" class="tab" type="button">Preview</button>
                        <button role="tab" id="tab-code" aria-controls="panel-code" aria-selected="false" tabindex="-1" class="tab" type="button">Code</button>
                    </div>
                    <div class="tab-tools">
                        <button class="btn btn-small" id="copy-btn" type="button"><i data-icon="copy" data-size="16"></i><span>Copy HTML</span></button>
                        <button class="btn btn-small" id="fullscreen-btn" type="button"><i data-icon="expand" data-size="16"></i><span>Fullscreen</span></button>
                    </div>
                </div>

                <section id="panel-preview" role="tabpanel" aria-labelledby="tab-preview" class="panel">
                    <div class="preview-frame" id="preview-frame"></div>
                </section>
                <section id="panel-code" role="tabpanel" aria-labelledby="tab-code" class="panel" hidden tabindex="0">
                    <pre class="code-view"><code id="code-view"></code></pre>
                </section>
            </article>
        </main>
    </div>

    <script type="module" src="js/viewer.js"></script>
</body>
</html>
