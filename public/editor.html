<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor – HTML Learning Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <div id="auth-gate" class="auth-gate" hidden></div>

    <div id="app-root" hidden>
        <header class="site-header">
            <a class="brand" href="index.html"><span class="brand-icon" aria-hidden="true">📚</span> HTML Learning Library</a>
            <span class="header-spacer"></span>
            <button id="theme-toggle" class="btn btn-icon" type="button" aria-label="Toggle dark mode">🌙</button>
        </header>

        <main>
            <h1 id="editor-heading">Add HTML Page</h1>
            <p class="state-box" id="editor-error" hidden></p>

            <form id="editor-form" novalidate>
                <fieldset class="info-grid">
                    <legend>Page Information</legend>
                    <div class="field">
                        <label for="title">Title</label>
                        <input id="title" type="text" maxlength="150" placeholder="Enter page title" required>
                    </div>
                    <div class="field">
                        <label for="category">Category</label>
                        <select id="category"></select>
                        <input id="custom-category" type="text" maxlength="40" placeholder="Custom category name" hidden aria-label="Custom category">
                    </div>
                    <div class="field wide">
                        <label for="description">Description</label>
                        <input id="description" type="text" maxlength="300" placeholder="Enter description">
                    </div>
                    <div class="field wide">
                        <label for="tags">Tags (comma separated)</label>
                        <input id="tags" type="text" placeholder="html, forms, beginner">
                    </div>
                </fieldset>

                <div class="editor-split">
                    <section class="pane">
                        <label for="html-code">HTML Editor</label>
                        <textarea id="html-code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"
                            placeholder="Paste your complete HTML here…"></textarea>
                        <p class="size-note" id="size-note"></p>
                    </section>
                    <section class="pane">
                        <span class="label-like" id="preview-label">Live Preview</span>
                        <div class="preview-wrap" id="preview-wrap" role="region" aria-labelledby="preview-label"></div>
                    </section>
                </div>

                <div class="editor-actions">
                    <button type="submit" class="btn btn-primary" id="save-btn" data-mode="save">Save Page</button>
                    <button type="button" class="btn btn-primary" id="save-preview-btn">Save &amp; Preview</button>
                    <button type="button" class="btn" id="clear-btn">Clear</button>
                    <a class="btn" id="cancel-btn" href="index.html">Cancel</a>
                </div>
            </form>
        </main>
    </div>

    <script type="module" src="js/editor.js"></script>
</body>
</html>
