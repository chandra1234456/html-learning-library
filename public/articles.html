<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saved Articles – HTML Learning Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/articles.css">
</head>
<body>
    <div id="auth-gate" class="auth-gate" hidden></div>

    <div id="app-root" hidden>
        <header class="site-header">
            <a class="brand" href="index.html"><span class="brand-icon"><i data-icon="book" data-size="20"></i></span><span class="brand-name">HTML Learning Library</span></a>
            <nav class="nav" aria-label="Main">
                <a class="nav-link" href="index.html"><i data-icon="grid"></i><span>Library</span></a>
                <a class="nav-link" href="reader.html"><i data-icon="reader"></i><span>Reader</span></a>
                <a class="nav-link" href="articles.html" aria-current="page"><i data-icon="bookmark"></i><span>Saved</span></a>
            </nav>
            <span class="header-spacer"></span>
            <button id="theme-toggle" class="btn btn-icon btn-ghost" type="button" aria-label="Toggle dark mode"></button>
            <a class="btn btn-primary btn-new" href="editor.html"><i data-icon="plus"></i><span>New page</span></a>
        </header>

        <main>
            <div class="page-head">
                <div>
                    <h1>Saved articles</h1>
                    <p class="page-sub" id="article-count" aria-live="polite"></p>
                </div>
                <button class="btn btn-ghost btn-small" id="refresh-btn" type="button" title="Reload from server"><i data-icon="refresh" data-size="16"></i><span>Refresh</span></button>
            </div>

            <div class="toolbar">
                <div class="search-field">
                    <i data-icon="search"></i>
                    <input id="search" type="search" aria-label="Search saved articles" placeholder="Search saved articles…" autocomplete="off">
                </div>
            </div>

            <section aria-live="polite">
                <div class="card-grid" id="skeletons">
                    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                </div>
                <div class="card-grid" id="cards" hidden></div>
                <div class="state-box" id="empty-state" hidden>
                    <div class="state-icon"><i data-icon="bookmark" data-size="32"></i></div>
                    <h2>No saved articles yet.</h2>
                    <p>Every article you open in the Reader is saved here automatically.</p>
                    <a class="btn btn-primary" href="reader.html"><i data-icon="reader"></i><span>Read an article</span></a>
                </div>
                <div class="state-box" id="no-results" hidden><h2>No articles found.</h2></div>
                <div class="state-box" id="load-error" hidden>
                    <h2>⚠ Unable to load saved articles</h2>
                    <p id="load-error-text"></p>
                    <button class="btn" id="retry-btn" type="button">Try again</button>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/articles.js"></script>
</body>
</html>
